name: Block issue closure until all checklist tasks are verified

on:
  issues:
    types: [closed, edited]

permissions:
  issues: write

concurrency:
  group: issue-checklist-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enforce-completion:
    if: github.event.issue.state == 'closed' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Reopen issues with missing or incomplete checklist
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.state !== 'closed' || issue.pull_request) return;
            const body = (issue.body || '').replace(/```[\s\S]*?```/g, '');
            const tasks = body.split(/\r?\n/).filter(line => /^\s*(?:[-*+]|\d+[.)])\s+\[[ xX]\]\s+\S/.test(line));
            const pending = tasks.filter(line => /\[ \]/.test(line));
            if (tasks.length > 0 && pending.length === 0) return;
            await github.rest.issues.update({ owner, repo, issue_number, state: 'open' });
            const reason = tasks.length === 0 ? 'no trackable Markdown tasks' : `${pending.length} of ${tasks.length} tasks unchecked`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body: `Issue automatically reopened: ${reason}. Every implementation and verification task must be checked [x] before closure. Attach evidence of completed work.` });
            core.setFailed(`Issue #${issue_number} reopened: ${reason}`);
