name: Require checklists on issue intake

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  seed-issue-checklist:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Supply a task checklist when missing
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: issue} = await github.rest.issues.get({owner, repo, issue_number});
            const body = issue.body || '';
            const withoutCode = body.replace(/```[\s\S]*?```/g, '');
            const hasTasks = withoutCode.split(/\r?\n/).some(
              line => /^\s*(?:[-*+]|\d+[.)])\s+\[[ xX]\]\s+/.test(line)
            );
            if (!hasTasks) {
              const checklist = [
                '',
                '## Required implementation and verification checklist',
                '<!-- titan-zero-intake-checklist:v1 -->',
                '- [ ] Inspect the actual source, identify the issue and record a reproducible baseline',
                '- [ ] Break this scope into specific, independently verifiable implementation tasks (replace this placeholder with the detailed breakdown)',
                '- [ ] Implement the required behavior while preserving security, tenants and current functionality',
                '- [ ] Add and run functional, negative, integration and regression tests',
                '- [ ] Link the implementation PR or commit and passing CI/test evidence',
                '- [ ] Verify all acceptance requirements and documentation; check tasks only after completion',
                '',
                '**Closure policy:** Every task must be checked before closing this issue.',
              ].join('\n');
              await github.rest.issues.update({
                owner, repo, issue_number, body: body.trimEnd() + '\n\n' + checklist,
              });
            }
