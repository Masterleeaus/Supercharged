name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck-required:
    # Gating, one job per area that already passes. Each area is checked on its own
    # (scripts/typecheck-area.mjs); whole-repo tsc is not run here. Areas still failing
    # are not in this matrix yet; see issue #122 and the PR description.
    name: Typecheck ${{ matrix.area }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - server/middleware
          - server/lib
          - server/plugins
          - server/demo-mode
          - server/infrastructure
          - client/src/contexts
          - client/src/lib
          - client/src/widget
          - client/src/i18n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/typecheck-area.mjs "${{ matrix.area }}"

  typecheck:
    name: Typecheck (informational)
    runs-on: ubuntu-latest
    # Informational only until the existing type errors are fixed (issue #15).
    # The job still runs and its output stays visible in the log; it does not
    # block merges while continue-on-error is true. Remove this line once #15 is done.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  marketing-postgres:
    name: Marketing PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MARKETING_PG_DISPOSABLE: 'true'
      MARKETING_PG_INTEGRATION_URL: postgres://postgres:ci-only-throwaway-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Marketing candidate without production changes
        run: node scripts/check-marketing-migration.mjs
      - name: Prepare ephemeral tenant-isolated Marketing tables
        run: node scripts/marketing-postgres-prepare.mjs
      - name: Verify Postgres RLS, isolation and lifecycle
        run: node --test --experimental-transform-types tests/postgres/marketing-postgres-*.test.mjs

  inbox-postgres:
    name: Inbox PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INBOX_PG_DISPOSABLE: 'true'
      INBOX_PG_INTEGRATION_URL: postgres://postgres:ci-only-throwaway-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Inbox RLS candidate without deployment
        run: node scripts/check-inbox-rls.mjs
      - name: Build disposable Inbox schema with restricted RLS
        run: node scripts/inbox-postgres-prepare.mjs
      - name: Verify real Inbox PostgreSQL storage, schema readiness and inbound service
        run: node --test --experimental-transform-types tests/postgres/inbox-postgres-*.test.mjs

  migration-inventory:
    name: Migration inventory
    runs-on: ubuntu-latest
    # Gating. Issue #34 (008 and 009 entries) is resolved: both files exist in migrations/.
    # The check reads the MIGRATIONS manifest in scripts/run-safe-migration.mjs and fails
    # when a required file is missing or the manifest format cannot be read.
    # scripts/run-safe-migration.mjs has no --dry-run flag, so this job checks
    # that every migration file the script lists exists under migrations/.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check listed migrations exist
        run: node scripts/check-migration-inventory.mjs

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    # Gating job: no continue-on-error. No repository or organisation secrets are used.
    # The app reads DATABASE_URL at import time (server/db.ts) and requires JWT_SECRET
    # in production (server/middleware/auth.ts). Both are set below as CI-only values
    # for a throwaway postgres service that exists only inside this job.
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only password. Not a real secret; the database lives only for this job.
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI placeholder only: points at the postgres service above (same throwaway password).
      DATABASE_URL: postgres://postgres:ci-only-throwaway-password@localhost:5432/postgres
      # CI placeholder only: satisfies the production JWT_SECRET check. Not used anywhere real.
      JWT_SECRET: ci-only-placeholder-jwt-secret-not-real
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t supercharged-ci .
      - name: Start container
        # --network host lets the app reach the postgres service on localhost:5432.
        # Host networking also exposes the app on localhost:5000, so no -p is needed.
        run: >-
          docker run -d --name app --network host
          -e NODE_ENV=production
          -e PORT=5000
          -e DATABASE_URL
          -e JWT_SECRET
          supercharged-ci
      - name: Wait for HTTP response on /health (up to 60s)
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' app 2>/dev/null)" != "true" ]; then
              echo "Container 'app' is not running after ${i}s; it exited."
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:5000/health || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "App answered with HTTP $code after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "No HTTP response from http://localhost:5000/health within 60s."
          exit 1
      - name: Dump container logs on failure
        if: failure()
        run: docker logs app || true
      - name: Remove container
        if: always()
        run: docker rm -f app || true
