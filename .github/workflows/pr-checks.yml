name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: Typecheck (informational)
    runs-on: ubuntu-latest
    # Informational only until the existing type errors are fixed (issue #15).
    # The job still runs and its output stays visible in the log; it does not
    # block merges while continue-on-error is true. Remove this line once #15 is done.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  migration-inventory:
    name: Migration inventory
    runs-on: ubuntu-latest
    # Informational until issue #34 is resolved: scripts/run-safe-migration.mjs lists
    # 008 and 009 files that are not in migrations/, so this job is red on main.
    # Remove continue-on-error once those entries are fixed.
    continue-on-error: true
    # scripts/run-safe-migration.mjs has no --dry-run flag, so this job checks
    # that every migration file the script lists exists under migrations/.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check listed migrations exist
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('scripts/run-safe-migration.mjs', 'utf8');
          const re = /resolve\(rootDir,\s*'migrations',\s*'([^']+)'\)/g;
          const names = [];
          let m;
          while ((m = re.exec(src))) names.push(m[1]);
          if (names.length === 0) {
            console.error('No migration names found in scripts/run-safe-migration.mjs');
            process.exit(1);
          }
          const missing = names.filter((n) => !fs.existsSync('migrations/' + n));
          console.log('Listed migrations: ' + names.length);
          if (missing.length) {
            console.error('Missing under migrations/:\n  ' + missing.join('\n  '));
            process.exit(1);
          }
          console.log('All listed migrations exist.');
          "

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    # Gating job: no continue-on-error. The smoke test runs without any secrets.
    # The app reads DATABASE_URL at import time (server/db.ts), so with no
    # database the container is expected to exit and this job fails.
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t supercharged-ci .
      - name: Start container
        run: docker run -d --name app -p 5000:5000 -e NODE_ENV=production supercharged-ci
      - name: Wait for HTTP response on /health (up to 60s)
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' app 2>/dev/null)" != "true" ]; then
              echo "Container 'app' is not running after ${i}s; it exited."
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:5000/health || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "App answered with HTTP $code after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "No HTTP response from http://localhost:5000/health within 60s."
          exit 1
      - name: Dump container logs on failure
        if: failure()
        run: docker logs app || true
      - name: Remove container
        if: always()
        run: docker rm -f app || true
