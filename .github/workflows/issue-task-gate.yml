name: Enforce complete issue task checklists

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  prevent-incomplete-closure:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Reopen issues with unchecked or missing tasks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: number,
            });
            const withoutCode = (issue.body || '')
              .replace(/```[\s\S]*?```/g, '');
            const tasks = withoutCode.split(/\r?\n/)
              .filter(line => /^\s*(?:[-*+]|\d+[.)])\s+\[[ xX]\]\s+/.test(line));
            const remaining = tasks.filter(line => /^\s*(?:[-*+]|\d+[.)])\s+\[ \]\s+/.test(line));
            if (tasks.length === 0 || remaining.length > 0) {
              await github.rest.issues.update({
                owner, repo, issue_number: number, state: 'open',
              });
              const explanation = tasks.length === 0
                ? 'This issue has no Markdown task checklist.'
                : `${remaining.length} of ${tasks.length} checklist tasks remain unfinished.`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `**Issue closure blocked.** ${explanation}\n\nComplete and verify every \`- [ ]\` task, mark it \`- [x]\`, then close the issue. Do not tick tasks without implementation/test evidence. This policy applies to every issue in this repository.`,
              });
              core.setFailed(`Issue #${number} reopened: ${explanation}`);
            }
