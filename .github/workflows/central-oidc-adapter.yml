name: Central SSO adapter checks
on:
  push:
    branches: [feat/central-product-oidc-adapter-pass25]
  pull_request:
    paths:
      - 'server/infrastructure/central-sso/**'
      - 'server/infrastructure/central-oidc/**'
      - 'tests/infrastructure/central-sso-*.test.mjs'
      - 'tests/infrastructure/central-oidc-*.test.mjs'
      - 'tests/infrastructure/central-oidc-fixtures.mjs'
      - 'docs/pending/central-sso-company-links.sql'
      - '.github/workflows/central-oidc-adapter.yml'
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Central sign-in, tenant boundaries, flags and signed events
        run: node --test --experimental-transform-types tests/infrastructure/central-sso-account-resolver.test.mjs tests/infrastructure/central-sso-session-gate.test.mjs tests/infrastructure/central-oidc-*.test.mjs tests/infrastructure/central-sso-oidc-flow.test.mjs tests/infrastructure/central-sso-service-client.test.mjs
