name: Authorised merged branch cleanup
on:
  push:
    branches: [Main, main]
    paths: ['.github/workflows/merged-branch-cleanup-20261112.yml']
permissions: {}
concurrency:
  group: authorised-merged-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Plan only branches already merged into the default
        env:
          CLEANUP_MODE: plan
        run: |
          cat > "$RUNNER_TEMP/merged_branch_cleanup.py" <<'PY'
          import base64,json,os,subprocess,tempfile,urllib.request,urllib.parse
          from pathlib import Path
          repo=os.environ["GH_REPOSITORY"]
          if repo not in {"Masterleeaus/Skilled","Masterleeaus/Sorted","Masterleeaus/Central","Masterleeaus/Supercharged"}:
              raise SystemExit("Repository outside the authorised cleanup")
          token=os.environ["GH_TOKEN"]
          root=Path(os.environ["RUNNER_TEMP"])
          plan_path=root/"cleanup-plan.json"
          report_path=root/"cleanup-result.json"
          def api(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers={
                  "Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28","User-Agent":"authorised-merged-branch-cleanup"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)
          def pages(path):
              result=[]
              for number in range(1,101):
                  rows=api(path+("&" if "?" in path else "?")+"per_page=100&page="+str(number))
                  if not isinstance(rows,list): raise RuntimeError("Unexpected collection")
                  result.extend(rows)
                  if len(rows)<100:return result
              raise RuntimeError("Pagination limit")
          def open_refs():
              refs=set()
              for pr in pages("/pulls?state=open"):
                  if pr.get("base",{}).get("repo",{}).get("full_name")==repo:refs.add(pr["base"]["ref"])
                  if (pr.get("head",{}).get("repo") or {}).get("full_name")==repo:refs.add(pr["head"]["ref"])
              return refs
          def branch(name):
              return api("/branches/"+urllib.parse.quote(name,safe=""))
          def ancestor(default_sha,tip):
              result=api("/compare/"+default_sha+"..."+tip)
              return result.get("status") in {"behind","identical"} and result.get("ahead_by")==0 and result.get("merge_base_commit",{}).get("sha")==tip
          def save(path,value):
              with path.open("w") as stream:
                  json.dump(value,stream,indent=2);stream.flush();os.fsync(stream.fileno())
          def plan():
              default=api("")["default_branch"];default_sha=branch(default)["commit"]["sha"]
              active=open_refs();out={"repository":repo,"default_branch":default,"default_sha":default_sha,"candidates":[],"retained":[]}
              for item in pages("/branches"):
                  name=item["name"];tip=item["commit"]["sha"];row={"branch":name,"sha":tip}
                  if name==default:reason="default_branch"
                  elif item.get("protected"):reason="protected"
                  elif name in active:reason="open_pull_request"
                  elif not ancestor(default_sha,tip):reason="not_fully_merged"
                  else:
                      out["candidates"].append(row);continue
                  out["retained"].append({**row,"reason":reason})
              save(plan_path,out)
              print(json.dumps({"planned":len(out["candidates"]),"retained":len(out["retained"])}),flush=True)
          def execute():
              data=json.loads(plan_path.read_text())
              if data["repository"]!=repo:raise RuntimeError("Plan repository mismatch")
              result={"repository":repo,"default_branch":data["default_branch"],"deleted":[],"retained":list(data["retained"]),"failed":[]}
              work=Path(tempfile.mkdtemp(prefix="merged-cleanup-"))
              subprocess.run(["git","init",str(work)],check=True,capture_output=True)
              subprocess.run(["git","remote","add","origin","https://github.com/"+repo+".git"],cwd=work,check=True,capture_output=True)
              git_env={**os.environ,"GIT_TERMINAL_PROMPT":"0","GIT_CONFIG_COUNT":"1",
                  "GIT_CONFIG_KEY_0":"http.https://github.com/.extraheader",
                  "GIT_CONFIG_VALUE_0":"AUTHORIZATION: basic "+base64.b64encode(("x-access-token:"+token).encode()).decode()}
              for row in data["candidates"]:
                  name=row["branch"];tip=row["sha"]
                  try:
                      default=api("")["default_branch"]
                      current=branch(name)
                      if default!=data["default_branch"] or name==default:reason="default_changed"
                      elif current.get("protected"):reason="protected"
                      elif current["commit"]["sha"]!=tip:reason="head_changed"
                      elif name in open_refs():reason="open_pull_request"
                      elif not ancestor(branch(default)["commit"]["sha"],tip):reason="no_longer_merged"
                      else:reason=None
                      if reason:
                          result["retained"].append({**row,"reason":reason});save(report_path,result);continue
                      check=subprocess.run(["git","check-ref-format","--branch",name],cwd=work,capture_output=True)
                      if check.returncode:raise RuntimeError("Invalid branch ref")
                      print("Verified merged; deletion lease "+json.dumps(row),flush=True)
                      pushed=subprocess.run(["git","-c","credential.helper=","push","--porcelain",
                          "--force-with-lease=refs/heads/"+name+":"+tip,"origin",":refs/heads/"+name],
                          cwd=work,env=git_env,capture_output=True,text=True,timeout=60)
                      if pushed.returncode:
                          result["failed"].append({**row,"reason":"push_refused_or_head_changed"})
                      else:
                          remaining=api("/git/matching-refs/heads/"+urllib.parse.quote(name,safe=""))
                          if any(ref.get("ref")=="refs/heads/"+name for ref in remaining):
                              result["failed"].append({**row,"reason":"ref_still_present"})
                          else:result["deleted"].append(row)
                  except Exception as error:
                      result["failed"].append({**row,"reason":type(error).__name__})
                  save(report_path,result)
              save(report_path,result)
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
                  summary.write("# Merged branch cleanup\n\nRepository: "+repo+"\n\n")
                  summary.write("Deleted: "+str(len(result["deleted"]))+"; retained: "+str(len(result["retained"]))+"; refused/errors: "+str(len(result["failed"]))+"\n\n")
                  summary.write("| Deleted branch | Preserved commit SHA |\n| --- | --- |\n")
                  for row in result["deleted"]:summary.write("| "+row["branch"]+" | "+row["sha"]+" |\n")
              print(json.dumps({"deleted":len(result["deleted"]),"retained":len(result["retained"]),"failed":len(result["failed"])}),flush=True)
              if result["failed"]:raise SystemExit(1)
          if os.environ["CLEANUP_MODE"]=="plan":plan()
          else:execute()
          PY
          python3 "$RUNNER_TEMP/merged_branch_cleanup.py"
      - name: Preserve restoration plan before any deletion
        uses: actions/upload-artifact@v4
        with:
          name: merged-branch-restoration-plan
          path: ${{ runner.temp }}/cleanup-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck ancestry and open PRs; delete with an exact head lease
        env:
          CLEANUP_MODE: execute
        run: python3 "$RUNNER_TEMP/merged_branch_cleanup.py"
      - name: Save verified deletion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-branch-cleanup-result
          path: ${{ runner.temp }}/cleanup-result.json
          if-no-files-found: warn
          retention-days: 90
