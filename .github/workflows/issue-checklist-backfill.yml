name: Backfill and maintain issue task checklists
on:
  issues:
    types: [opened, edited, reopened]
  push:
    paths: ['.github/workflows/issue-checklist-backfill.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-task-backfill-${{ github.repository }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Break down missing checklists without marking work complete
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const completed = t => /^\s*[-*+]\s+\[[ xX]\]\s+\S/m.test(t || '');
            const verbs = /^(add|align|audit|block|build|check|configure|connect|convert|correct|create|define|deliver|design|document|enforce|ensure|establish|fix|implement|integrate|map|migrate|move|preserve|prevent|publish|reconcile|refactor|register|remove|replace|require|resolve|restore|review|run|secure|ship|split|support|test|trace|update|validate|verify|wire)\b/i;
            function plan(issue) {
              const body = (issue.body || '').split(/^#{1,4}\s+(?:Historical scope|Superseded plan|Older implementation)\b/im)[0];
              let section = '', code = false;
              const tasks=[], seen=new Set();
              const included = /(scope|implementation|deliver|work|requirement|acceptance|done|suggested fix|tasks|security|test|migration|new optional ai|local capability|integration|policy)/i;
              const add = item => {
                let s = item.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '').replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1')
                  .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
                if (s.length < 22 || /^(parent|related|depends on|source:|reference|generated by|https?:\/\/|see\s+#)/i.test(s)) return;
                if (/^- \[[ xX]\]/.test(s)) return;
                if (s.length > 280) s=s.slice(0,277).replace(/\s+\S*$/,'')+'…';
                if (!verbs.test(s)) s='Implement and verify the requirement: '+s;
                s=s.replace(/[. ]+$/,'');
                const key=s.toLowerCase();
                if (!seen.has(key) && tasks.length<7) { seen.add(key); tasks.push(s); }
              };
              for (const raw of body.split('\n')) {
                const line=raw.trim();
                if (/^(\x60{3}|~{3})/.test(line)) {code=!code;continue;}
                if(code||!line||/^---+$/.test(line)||/^>/.test(line)||/^<!--/.test(line))continue;
                if(/^#{1,4}\s+/.test(line)){section=line.replace(/^#{1,4}\s+/,'');continue;}
                if(included.test(section) || /^[-*+]\s/.test(line)){
                  for(const phrase of line.split(/;\s+(?=[A-Z])|(?<=\.)\s+(?=[A-Z][a-z])/))add(phrase);
                }
              }
              if (repo.toLowerCase()==='titan-zero-front-desk-pro') {
                tasks.unshift('Classify this historical Pro backlog item under the single Free Front Desk plugin or optional hosted Assistant/Agent Team; do not create a separate Pro plugin');
                tasks.push('Link the canonical Front Desk implementation issue and verify migration of relevant acceptance criteria');
              }
              if(!tasks.length)tasks.push('Break the issue scope into concrete implementation steps and identify the authoritative modules');
              tasks.push('Implement the scoped change and link source commits or pull requests with evidence');
              tasks.push('Add or update automated regression and negative/security tests relevant to this issue');
              tasks.push('Run CI and verify every acceptance criterion before marking any checklist item complete');
              return tasks.slice(0,12);
            }
            async function inspect(issue) {
              if(!issue||issue.pull_request||issue.state!=='open')return;
              const latest=(await github.rest.issues.get({owner,repo,issue_number:issue.number})).data;
              if(latest.state!=='open'||completed(latest.body))return;
              const tasks=plan(latest);
              const suffix='\n\n## Implementation checklist\n\n<!-- auto-backfilled; review tasks against issue scope and mark [x] ONLY with verified evidence -->\n'+tasks.map(x=>'- [ ] '+x).join('\n')+'\n';
              await github.rest.issues.update({owner,repo,issue_number:latest.number,body:(latest.body||'').trimEnd()+suffix});
              core.notice('Backfilled #'+latest.number+': '+tasks.length+' unchecked tasks');
            }
            if(context.eventName==='issues')await inspect(context.payload.issue);
            else{
             const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
             for(const issue of issues)await inspect(issue);
             core.notice('Inspected '+issues.filter(x=>!x.pull_request).length+' open issues');
            }
