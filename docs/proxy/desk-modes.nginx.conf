# ============================================================================
# TEMPLATE - NOT APPLIED. Review, replace every REPLACE value, then load it.
# Nothing in this repository includes this file. Not validated with nginx -t.
#
# Trusted-proxy rules for the two Desk mode domains (C6):
#   1. Host is set from $host, never copied from a client header.
#   2. Client-supplied X-Forwarded-Host and X-Forwarded-For are replaced, not appended to.
#      Each is set from a value this proxy computes, so the app only sees proxy-set values.
#   3. Other forwarding headers a client might send (Forwarded, X-Original-Host, X-Host)
#      are blanked. An empty proxy_set_header value removes the header.
#   4. Any Host that is not on the allowlist is closed with 444 before it reaches the app.
#
# Note on $host: nginx takes it from the request line if that is an absolute URI, otherwise
# from the Host header. So $host is still client input. The server_name allowlist below is
# what makes it safe. The app's own allowlist (buildModeConfig) is the second check.
#
# Note for the app: server/modules/desk-modes/mode-middleware.ts reads Host only and never
# reads X-Forwarded-Host. The X-Forwarded-Host line below is therefore not used for mode
# resolution. An nginx change is needed only if the proxy rewrites Host.
# ============================================================================

# Mode allowlist. Keep in step with the workforce and comms hosts in the app config.
map $host $desk_mode_host_ok {
    default                  0;
    supercharged.at.work     1;   # workforce host (nginx lower-cases $host)
    syncedat.work            1;   # comms host
}

upstream desk_app {
    # REPLACE: the app listens on PORT (default 5000 in server/index.ts).
    server 127.0.0.1:5000;
    keepalive 16;
}

# Catch-all. Unknown Host values get no response and never reach the app.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    # REPLACE: a certificate is needed for the 443 default server. Any valid cert will do.
    ssl_certificate     /etc/ssl/REPLACE/catchall.crt;
    ssl_certificate_key /etc/ssl/REPLACE/catchall.key;
    return 444;
}

# Both Desk domains. server_name lists the exact hosts, and the map above is checked too.
server {
    listen 443 ssl;
    server_name supercharged.at.work syncedat.work;   # REPLACE: must match the map above

    # REPLACE: certificate and key for these domains.
    ssl_certificate     /etc/ssl/REPLACE/desk.crt;
    ssl_certificate_key /etc/ssl/REPLACE/desk.key;

    if ($desk_mode_host_ok = 0) {
        return 444;
    }

    # Client-supplied forwarding headers: blank them so none pass through.
    proxy_set_header Forwarded        "";
    proxy_set_header X-Original-Host  "";
    proxy_set_header X-Host           "";

    location / {
        proxy_pass http://desk_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Set from the proxy, replacing any client value.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}

# Express side (not nginx): set `trust proxy` to this proxy's address only, never to true.
# With `trust proxy: true` a client can forge X-Forwarded-For and req.ip.
