<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    window.onerror = function (msg, src, line, col, err) {
      if (err instanceof SyntaxError || (typeof msg === 'string' && msg.indexOf('SyntaxError') !== -1)) {
        if (!err || !err.stack || !err.stack.includes(' at ')) {
          return true;
        }
      }
      return false;
    };
    window.addEventListener("error", function (evt) {
      if (!evt.error || (evt.error instanceof SyntaxError && (!evt.error.stack || !evt.error.stack.includes(" at ")))) {
        evt.stopImmediatePropagation();
        evt.preventDefault();
        return;
      }
    }, true);
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Supercharged</title>
  <meta name="description" content="Supercharged business communications and AI operations workspace." />
  <link rel="icon" type="image/png" href="/favicon.png" id="dynamic-favicon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        // Match BrandingProvider's v3 cache and 24-hour expiry.
        // Old v1 cache entries are ignored rather than resurrecting stale branding.
        var cached = localStorage.getItem('agentlabs-branding:v3');
        if (!cached) return;
        var parsed = JSON.parse(cached);
        var age = Date.now() - parsed.timestamp;
        if (!Number.isFinite(age) || age < 0 || age > 24 * 60 * 60 * 1000 || !parsed.data) return;
        if (typeof parsed.data.app_name === 'string' && parsed.data.app_name.trim()) {
          document.title = parsed.data.app_tagline
            ? parsed.data.app_name + ' - ' + parsed.data.app_tagline
            : parsed.data.app_name;
        }
        if (parsed.data.favicon_url) {
          var favicon = document.getElementById('dynamic-favicon');
          if (favicon) favicon.href = parsed.data.favicon_url;
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>


</body>

</html>
